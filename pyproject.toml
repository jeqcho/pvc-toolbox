[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-toolbox"
version = "0.1.0"
description = "Tools for computing the Proportional Veto Core (PVC) and epsilon-PVC"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "PVC Toolbox Contributors"}
]
keywords = ["voting", "social choice", "proportional veto core", "pvc", "computational social choice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
fast = ["scipy>=1.7.0"]
dev = ["pytest>=7.0.0", "scipy>=1.7.0"]

[project.urls]
Homepage = "https://github.com/pvc-toolbox/pvc-toolbox"
Documentation = "https://github.com/pvc-toolbox/pvc-toolbox#readme"
Repository = "https://github.com/pvc-toolbox/pvc-toolbox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

